# Build the image and deploy it to Cloud Run.
#
# The target is a NEW service, never the predecessor's `snackbyte-discord`. Sharing one
# service would couple the two deployments and make the migration's per-source cutover and
# its rollback impossible: the old service must keep serving untouched while the new one
# takes traffic one webhook at a time.
#
# EVERY environment-varying value is a REQUIRED substitution with no default. That is
# deliberate and it is the whole point of this file's shape.
#
# `_SERVICE: grimoire` used to be a default here, and the two secrets were hardcoded to
# `grimoire-database-url` / `grimoire-discord-bot-token` — names that read like production
# but held STAGING values. A deploy invoked without substitutions would therefore have
# created a production service silently wired to the staging database, and nothing anywhere
# would have reported a problem. The failure would have surfaced later, somewhere unrelated,
# as inexplicably wrong data.
#
# With no defaults, an incomplete invocation fails immediately with a message naming the
# missing substitution. `release.yml` supplies all of them from the branch. Adding an
# environment means adding a mapping there, never editing this file.

substitutions:
  _SERVICE: '' # e.g. grimoire (main/production) or grimoire-staging (dev/staging)
  _REGION: ''
  _DATABASE_URL_SECRET: ''
  _BOT_TOKEN_SECRET: ''
  _RUNTIME_SA: '' # the per-tier runtime service account; scoped to only this tier's secrets
  # Always-on or scale-to-zero, per tier. Prod holds connections and must not cold-start on
  # every event (1); staging sees no traffic and pays for nothing while idle (0). Required —
  # a default here would silently bill an always-on instance for a tier nobody is using.
  _MIN_INSTANCES: ''
  # The Discord app's Ed25519 PUBLIC key (not a secret), per environment. Optional by design:
  # empty ⇒ the interactions endpoint is disabled (503), and NOTHING else changes — so it is
  # NOT in the required-substitutions check below. A tier turns interactions on by supplying it.
  _DISCORD_PUBLIC_KEY: ''

# Refuse to run rather than guess. Cloud Build does not enforce required substitutions, so
# the check is explicit and it is the first thing that happens.
options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

steps:
  - id: require-substitutions
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        missing=""
        [ -z "${_SERVICE}" ]             && missing="$$missing _SERVICE"
        [ -z "${_REGION}" ]              && missing="$$missing _REGION"
        [ -z "${_DATABASE_URL_SECRET}" ] && missing="$$missing _DATABASE_URL_SECRET"
        [ -z "${_BOT_TOKEN_SECRET}" ]    && missing="$$missing _BOT_TOKEN_SECRET"
        [ -z "${_RUNTIME_SA}" ]          && missing="$$missing _RUNTIME_SA"
        [ -z "${_MIN_INSTANCES}" ]       && missing="$$missing _MIN_INSTANCES"
        if [ -n "$$missing" ]; then
          echo "REFUSING TO DEPLOY. Missing required substitutions:$$missing" >&2
          echo "A default for any of these could deploy the wrong code, or the right code" >&2
          echo "wired to the wrong environment's data. Pass them explicitly." >&2
          exit 1
        fi
        echo "deploying '${_SERVICE}' to '${_REGION}'"
        echo "  database secret: ${_DATABASE_URL_SECRET}"
        echo "  bot token secret: ${_BOT_TOKEN_SECRET}"
        echo "  min instances: ${_MIN_INSTANCES}"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/grimoire/${_SERVICE}:$TAG_NAME'
      - '.'

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/grimoire/${_SERVICE}:$TAG_NAME'

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/grimoire/${_SERVICE}:$TAG_NAME'
      - '--region=${_REGION}'
      - '--platform=managed'
      # The runtime identity is per-tier and scoped to ONLY this tier's secrets (an IAM
      # condition on the grimoire-<env>- name prefix). This is the enforced half of isolation:
      # even if _DATABASE_URL_SECRET above named the wrong tier's secret, this identity could
      # not read it — the deploy fails closed instead of silently serving prod against staging.
      - '--service-account=${_RUNTIME_SA}'
      # Per tier (see the substitution): prod always-on, staging scale-to-zero.
      - '--min-instances=${_MIN_INSTANCES}'
      # Public at the transport layer ON PURPOSE. A webhook source (GitHub, ClickUp) cannot
      # present a Google IAM identity, so the service must accept anonymous invocation — and
      # the app does its OWN authentication in the law, verifying an HMAC over the raw bytes
      # before anything is parsed. Without this line a fresh service deploys private and every
      # webhook gets 403 at the edge, never reaching that verification. It bit prod on its
      # first CI deploy; making it explicit here means a redeploy can never silently re-close.
      - '--allow-unauthenticated'
      # ORTHOGONAL to --allow-unauthenticated above, and easy to mistake for a duplicate of it.
      # That flag is the INVOKER (who may call: anyone, because a webhook source has no Google
      # identity). This one is the PATH (where a call may arrive from: the load balancer only,
      # never directly on *.run.app). A webhook reaches grimoire.snackbyte.io, so it comes
      # through the LB and is unaffected; what this rejects is someone bypassing the LB -- and
      # with it Cloud Armor -- by hitting the run.app URL. The live services already carry this
      # ingress, but it was set by hand at stand-up and nothing re-asserted it, so a recreated
      # service would have come up open. Do not remove either line thinking it covers the other.
      - '--ingress=internal-and-cloud-load-balancing'
      # Secrets arrive from Secret Manager, never from this file, and their NAMES are
      # per-environment so staging can never read production's database.
      - '--update-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,DISCORD_BOT_TOKEN=${_BOT_TOKEN_SECRET}:latest'
      # DISCORD_PUBLIC_KEY is a plain env var (public, not a secret). Empty in a tier that has not
      # opted into interactions — the app reads empty as unset and serves 503 on that endpoint.
      - '--set-env-vars=LOG_LEVEL=info,DISCORD_PUBLIC_KEY=${_DISCORD_PUBLIC_KEY}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/grimoire/${_SERVICE}:$TAG_NAME'
